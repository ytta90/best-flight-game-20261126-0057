<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AERIS — Canyon Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141c33; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#eaf6ff;font:16px sans-serif;text-align:center;padding:2em">AERIS — Canyon Run needs JavaScript to fly. Please enable it and reload.</p></noscript>
<canvas id="game" aria-label="AERIS Canyon Run: fly the canyon, thread the rings, mind the fuel, land it if you can"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
